# アフィリエイト案件の一覧。
#
# ■ 人間がやること（1回だけ）
#   ASP（A8.net / もしもアフィリエイト / afb / バリューコマース など）で提携承認を受けたら、
#   その案件の「広告リンクURL」を url に貼り付けるだけです。
#   url が空の案件は、記事中ではリンクなしの紹介文として表示されます（サイトは壊れません）。
#
# ■ est_reward_jpy について
#   記事テーマの優先順位づけにだけ使う「仮の目安」です。実際の報酬額ではありません。
#   提携後、ASP管理画面の報酬額に書き換えると優先順位の精度が上がります。
#
# ■ 記事での書き方
#   本文中に {{aff:ID}} と書くとCTAボックス、{{aff:ID|リンク文言}} と書くと文中リンクになります。

