          description: 厚生労働省の専門実践教育訓練給付金（最大80%）の対象と公式ページに書かれているITスクール{n}校を、対象講座・条件・確認日つきでまとめました。
          intro: 厚生労働省の専門実践教育訓練給付金（受講費の最大80%・年間上限64万円）の対象と公式ページに書かれているスクール{n}校です。
      faq:
        - q: 教育訓練給付金とリスキリング補助金は、同じ講座で両方使えますか？
          a: スクールや講座によって扱いが違います。たとえば Kredo は、リスキリング補助金と専門実践教育訓練給付金の併用はできないと公式ページに書いています。申し込む前に、スクールの無料カウンセリングで確かめてください。
        - q: 今、仕事をしていなくても使えますか？
          a: 教育訓練給付金は、離職してから1年以内などの条件を満たせば対象になることがあります。経済産業省のリスキリング補助金は、今働いていて（雇用契約があり）転職を目指す人が対象で、無職の人は対象外としているスクールが多いです。
        - q: お金はいつ戻ってきますか？
          a: 教育訓練給付金は、本人がハローワークに申請して受け取ります。一般・特定一般は修了後、専門実践は受講中から6か月ごとに申請します。リスキリング補助金は、国からスクールに支払われ、受講料の値引きや還元の形で負担が軽くなります。
        - q: リスキリング補助金はいつまで使えますか？
          a: 経済産業省は2026年10月に、事業期間を1年延長すると発表しています。ただし、申込の受付や修了の期限はスクールごとに違います（たとえばデジタルハリウッドSTUDIOは、2027年3月31日までに修了する場合に限るとしています）。各スクールの公式ページで確かめてください。
        - q: 自分が対象かどうかは、どこで確かめられますか？
          a: 教育訓練給付金は、住所を管轄するハローワークで、受けられるかどうか（支給要件）を照会できます。リスキリング補助金は、スクールの無料カウンセリングで、雇用の形や転職の予定をもとに確かめてもらえます。
