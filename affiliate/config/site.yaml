      category: EducationalApplication
      guide: mikeiken-it-tenshoku
      jobtag: mukiteiru-shigoto-wakaranai-shindan
      cta: 8つの質問で、向いているIT職種を診断する（無料・1分）

  # テーマ別ガイド（/guide/<slug>/）。強いテーマの記事を「読む順番」に並べたまとめページで、各記事からもリンクされる。
  # match はタイトル・キーワードに対する正規表現。記事は最初に当てはまったガイドの、最初に当てはまった段階に入る
  guides:
    - slug: kyufukin
      title: 給付金・補助金で学び直すためのガイド
      description: 教育訓練給付金・リスキリング補助金・職業訓練など、社会人が学び直しに使える制度を「知る→条件を確かめる→申請する→講座を選ぶ」の順に整理したまとめページです。
      intro: 学び直しの費用を、国の制度でどこまで軽くできるのか。制度の名前が似ていて、どれが自分に当てはまるのかわかりにくい分野です。このページでは、スキルコンパスの記事を読む順番に並べました。上から順に読めば、自分が使える制度と、次にやることがわかるようにしています。
      match: 給付|補助|助成|リスキリング|リカレント|職業訓練|ハロートレ|教育訓練
      steps:
        - name: まず、使える制度の全体像を知る
          match: 個人|比較|違い|リカレント|とは
        - name: 自分が対象か、いくらもらえるかを確かめる
          match: 条件|対象|いつ|しない|主婦|代|退職
        - name: 申請の手続きを進める
          match: 申請|書類|確認票|電子|流れ|手続
        - name: 講座・スクールを選ぶ
          match: スクール|講座|ハロートレ|職業訓練|併用
    - slug: it-fukugyo
      title: ITスキルで副業を始めるためのガイド
      description: Web制作・Webデザイン・ブログ・プログラミングなど、ITスキルを使った副業の始め方と、続けるための判断材料を順番に整理したまとめページです。
      intro: ITスキルを使った副業は、始めるまでの準備と、最初の案件を取るまでがいちばんの山場です。向き不向きや、会社員としての注意点もあります。このページでは、副業の選び方から最初の一歩までを、読む順番に並べました。
      match: 副業|Web制作|ブログ|勘定科目|フリーランス
      steps:
        - name: 副業の種類と現実を知る
          match: 稼げない|現実|難しい|きつい|やめとけ
        - name: 始め方と準備
          match: 始め方|手順|未経験|ブログ|サーバー
        - name: 案件の取り方とお金の管理
          match: 案件|勘定科目|単価|週3|土日
    - slug: mikeiken-it-tenshoku
      title: 未経験からIT転職するためのガイド
      description: 未経験からエンジニア・IT職への転職を考えている社会人向けに、職種選び・学び方・応募書類・エージェントの使い方を順番に整理したまとめページです。
      intro: 未経験からのIT転職は、「何から始めて、どこまで準備すれば応募できるのか」が見えにくい道のりです。年代や今の仕事によっても、取るべき順番は変わります。このページでは、職種を知るところから内定までを、読む順番に並べました。
      match: 転職|エンジニア|職種|志望動機|面接|ポートフォリオ|エージェント|社内SE|インフラ|半導体|組み込み|機械設計
      steps:
        - name: 職種と現実を知る
          match: 職種|種類|現実|やめとけ|無理|可能|年収
        - name: スキルと実績を準備する
          match: ポートフォリオ|資格|AWS|学習|スクール
        - name: 応募・面接の準備をする
          match: 志望動機|面接|在職中|フルリモート
        - name: エージェント・相談先を使う
          match: エージェント|相談|コーチング|複数
    - slug: dokugaku
      title: 働きながらプログラミングを独学するためのガイド
      description: 社会人が働きながらプログラミングを独学するための、言語選び・学習時間・教材・挫折しないコツを順番に整理したまとめページです。
      intro: 仕事を終えてからの限られた時間で、独学を続けるのは簡単ではありません。何から始めるか、どの言語を選ぶか、どの教材を使うかで、遠回りの度合いが大きく変わります。このページでは、独学を始める前から続けるコツまでを、読む順番に並べました。
      match: 独学|ロードマップ|勉強|学習時間|入門書|参考書|難しい|AIコーディング|生成AI
      steps:
        - name: 何から始めるかを決める
          match: 何から|ロードマップ|順番|勉強方法|学び方
        - name: 学習時間と続け方を考える
          match: 時間|働きながら|挫折|難しい
        - name: 教材を選ぶ
          match: 本|入門書|参考書|無料|講座|ツール|選び方

# 自動運用の設定
autopilot:
  model: "claude-opus-5"
  workspace_id: "wrkspc_0159o3VjVNMSCssUgJUVKoZD"  # ワークスペースに紐づかないAPIキーの場合に指定（wrkspc_...）。秘密情報ではない
  enhance_per_run: 3             # 図解ボックス等が入っていない既存記事を1回あたり何本リニューアルするか
  articles_per_run: 2            # 1回の実行で公開する最大記事数（1日1回実行 → 月約60本）
  min_queue_size: 15             # キーワードの在庫がこれを下回ったら自動で補充
  refresh_per_run: 1             # 1回の実行で見直す既存記事の最大数
  refresh_after_days: 90         # 公開からこの日数を超えた記事は情報更新の対象
  monthly_budget_usd: 50         # API費用の月間上限（超えたら生成を停止）。軌道に乗ったら引き上げる
  max_repair_attempts: 1         # 品質チェック不合格時の自動修正回数
  min_editor_score: 7            # AI編集長レビューの合格点（10点満点）

# 品質ゲート（自動チェック）の基準
quality:
  min_chars: 4000
  max_chars: 20000
  min_h2: 4
  min_sources: 2
  max_similarity: 0.45           # 既存記事との類似度上限（文字3-gram Jaccard）
  require_audience: true         # 誰のための記事か（audience）を必須にする
  min_blocks: 2                  # 図解ボックス（:::point など）の最低数
