      title: IT職種診断｜8つの質問で向いている仕事の目安がわかる【無料】
      description: 未経験からIT業界を目指す社会人向けに、8つの質問で、Webエンジニア・インフラ・社内SE・Webデザイナー・データ/AI・組み込みのうち、向いている職種の目安がわかる無料の診断です。
