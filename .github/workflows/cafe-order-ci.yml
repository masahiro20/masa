name: cafe-order-ci

on:
  pull_request:
    paths:
      - "cafe-order/**"
      - ".github/workflows/cafe-order-ci.yml"

defaults:
  run:
    working-directory: cafe-order

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cafe-order/package-lock.json
      - run: npm ci
      - run: npm test
