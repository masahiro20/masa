name: gaihi-ci

on:
  push:
    paths: ["gaihi/**", ".github/workflows/gaihi-ci.yml"]
  pull_request:
    paths: ["gaihi/**", ".github/workflows/gaihi-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gaihi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gaihi/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
