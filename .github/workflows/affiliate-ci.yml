name: affiliate-ci

on:
  pull_request:
    paths:
      - "affiliate/**"
      - ".github/workflows/affiliate-*.yml"

defaults:
  run:
    working-directory: affiliate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: affiliate/requirements.txt
      - name: Install Japanese fonts (for cover images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m engine check
      - run: python -m engine build
