name: affiliate-autopilot

# サイトの生成・公開・検索エンジンへの通知を行う。
# 記事の執筆は Claude Code の Routine（月額プランの利用枠）が毎朝行い、affiliate-publish.yml 経由でここを呼び出す。
# 手動実行で mode=generate を選ぶと、従来どおり API キーを使って記事を生成する（クレジットを消費する）。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = 公開のみ（既定） / generate = APIで記事生成（クレジット消費）"
        required: false
        default: "build"
        type: choice
        options: [build, generate]
      slugs:
        description: "検索エンジンに通知する記事の slug（空白区切り・任意）"
        required: false
        default: ""
      articles:
        description: "[generate] 今回生成する記事数（空欄なら設定値）"
        required: false
        default: ""
      refresh:
        description: "[generate] 今回改善する既存記事数（空欄なら設定値）"
        required: false
        default: ""
      enhance:
        description: "[generate] 今回リニューアルする既存記事数（空欄なら設定値）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "affiliate/**"
      - ".github/workflows/affiliate-autopilot.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: affiliate-autopilot
  cancel-in-progress: false

defaults:
  run:
    working-directory: affiliate

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 待たされて後から始まった実行でも、直前の実行が追加した記事を含む最新の main から始める
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: affiliate/requirements.txt
      - name: Install Japanese fonts (for cover images)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

      - name: Generate articles and build site
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'generate'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          INPUT_ARTICLES: ${{ github.event.inputs.articles }}
          INPUT_REFRESH: ${{ github.event.inputs.refresh }}
          INPUT_ENHANCE: ${{ github.event.inputs.enhance }}
        run: |
          ARGS=()
          if [[ "$INPUT_ARTICLES" =~ ^[0-9]+$ ]]; then ARGS+=(--articles "$INPUT_ARTICLES"); fi
          if [[ "$INPUT_REFRESH" =~ ^[0-9]+$ ]]; then ARGS+=(--refresh "$INPUT_REFRESH"); fi
          if [[ "$INPUT_ENHANCE" =~ ^[0-9]+$ ]]; then ARGS+=(--enhance "$INPUT_ENHANCE"); fi
          python -m engine autopilot "${ARGS[@]}"

      - name: Build site only
        if: github.event_name != 'workflow_dispatch' || inputs.mode != 'generate'
        run: python -m engine build

      - name: Commit generated content
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'generate'
        run: |
          git config user.name "affiliate-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "autopilot: $(date -u +%Y-%m-%d) 記事の追加・更新"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 運用状況を1つの Issue にまとめ、対応が必要なときだけコメントで通知する（スマホに通知が届く）
      - name: Report to issue
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="アフィリエイト運用レポート"
          NUM=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$TITLE" --body-file data/STATUS.md)
            NUM="${URL##*/}"
          else
            gh issue edit "$NUM" --body-file data/STATUS.md
          fi
          if [ -f data/ALERT.md ]; then gh issue comment "$NUM" --body-file data/ALERT.md; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: affiliate/public
      - uses: actions/upload-artifact@v4
        with:
          name: changed-urls
          path: affiliate/data/last_changed.json
          if-no-files-found: ignore

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: changed-urls
          path: affiliate/data
        continue-on-error: true
      - name: Notify IndexNow
        env:
          INPUT_SLUGS: ${{ inputs.slugs }}
        run: |
          if [ -n "$INPUT_SLUGS" ]; then
            # slug は英小文字・数字・ハイフンのみ受け付ける
            SLUGS=$(echo "$INPUT_SLUGS" | tr ' ' '\n' | grep -E '^[a-z0-9-]+$' | tr '\n' ' ')
            python -m engine ping --slugs $SLUGS
          else
            python -m engine ping
          fi
