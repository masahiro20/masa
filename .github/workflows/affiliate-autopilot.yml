name: affiliate-autopilot

# 毎朝 6:07 (JST) に「キーワード補充 → 記事生成 → 既存記事の改善 → サイト生成 → 公開 → 検索エンジン通知」を全自動で実行する。
on:
  schedule:
    - cron: "7 21 * * *"
  workflow_dispatch:
    inputs:
      articles:
        description: "今回生成する記事数（空欄なら設定値。初回は 10 などで一気に作成可）"
        required: false
        default: ""
      refresh:
        description: "今回改善する既存記事数（空欄なら設定値）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "affiliate/**"
      - ".github/workflows/affiliate-autopilot.yml"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: affiliate-autopilot
  cancel-in-progress: false

defaults:
  run:
    working-directory: affiliate

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: affiliate/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

      - name: Generate articles and build site
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          INPUT_ARTICLES: ${{ github.event.inputs.articles }}
          INPUT_REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          ARGS=()
          if [[ "$INPUT_ARTICLES" =~ ^[0-9]+$ ]]; then ARGS+=(--articles "$INPUT_ARTICLES"); fi
          if [[ "$INPUT_REFRESH" =~ ^[0-9]+$ ]]; then ARGS+=(--refresh "$INPUT_REFRESH"); fi
          python -m engine autopilot "${ARGS[@]}"

      - name: Build site only
        if: github.event_name == 'push'
        run: python -m engine build

      - name: Commit generated content
        if: github.event_name != 'push'
        run: |
          git config user.name "affiliate-autopilot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "autopilot: $(date -u +%Y-%m-%d) 記事の追加・更新"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 運用状況を1つの Issue にまとめ、対応が必要なときだけコメントで通知する（スマホに通知が届く）
      - name: Report to issue
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="アフィリエイト運用レポート"
          NUM=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -z "$NUM" ]; then
            URL=$(gh issue create --title "$TITLE" --body-file data/STATUS.md)
            NUM="${URL##*/}"
          else
            gh issue edit "$NUM" --body-file data/STATUS.md
          fi
          if [ -f data/ALERT.md ]; then gh issue comment "$NUM" --body-file data/ALERT.md; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: affiliate/public
      - uses: actions/upload-artifact@v4
        with:
          name: changed-urls
          path: affiliate/data/last_changed.json
          if-no-files-found: ignore

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify-search-engines:
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: changed-urls
          path: affiliate/data
        continue-on-error: true
      - run: python -m engine ping
