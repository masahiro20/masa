<title>喫茶ことり 注文デモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700&display=swap">
<style>
  /* レイアウト：上に短い説明、下に iPad（オーナー）とスマホ（お客様）を実寸比で並べる。狭い画面では切り替え */
  :root {
    --ground: #ece4d8;
    --panel: #f8f3ec;
    --ink: #2b211b;
    --muted: #75655a;
    --accent: #6b3e26;
    --accent-soft: #e6d3c1;
    --bezel: #1f1a17;
    --line: #d8cbbb;
    --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #171310; --panel: #221c18; --ink: #f1e8de; --muted: #b4a394; --accent: #d9a47a; --accent-soft: #3a2c22;
      --bezel: #050403; --line: #3b322b; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground: #171310; --panel: #221c18; --ink: #f1e8de; --muted: #b4a394; --accent: #d9a47a; --accent-soft: #3a2c22;
    --bezel: #050403; --line: #3b322b; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 20px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
  }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 20px; }
  h1 { font-family: var(--display); font-size: 24px; margin: 0; letter-spacing: .04em; text-wrap: balance; }
  .lead { color: var(--muted); margin: 2px 0 0; }
  .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; flex: 1; min-width: 0; }
  .steps li { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .steps b { color: var(--accent); margin-right: 4px; font-variant-numeric: tabular-nums; }
  button, select { font: inherit; color: inherit; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .btn:focus-visible, select:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .confirm { display: inline-flex; gap: 6px; align-items: center; }

  .tabs { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
  .tab { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 8px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--panel); }

  .stage { flex: 1; min-height: 0; display: flex; gap: 20px; align-items: flex-start; justify-content: center; }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .col.ipad { flex: 1 1 auto; max-width: 1240px; }
  .col.phone { flex: 0 0 auto; }
  .label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; }
  .label small { font-weight: 400; color: var(--muted); }
  .label select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 6px; }
  .fit { position: relative; overflow: hidden; }
  .device { position: absolute; top: 0; left: 0; transform-origin: top left; background: var(--bezel); box-sizing: content-box; }
  .device iframe { display: block; border: 0; width: 100%; height: 100%; background: #f5efe6; }
  .device.ipad { border: 14px solid var(--bezel); border-radius: 34px; }
  .device.ipad iframe { border-radius: 10px; }
  .device.phone { border: 12px solid var(--bezel); border-radius: 46px; }
  .device.phone iframe { border-radius: 34px; }

  /* 狭い画面：どちらか一方を全幅で表示 */
  body > * { flex-shrink: 0; }
  @media (max-width: 860px) {
    html, body { height: auto; }
    h1 { font-size: 21px; }
    .steps { display: none; }
    .tabs { display: flex; }
    .stage { flex-direction: column; align-items: stretch; }
    .col { flex: 1 1 auto !important; max-width: none; }
    .col[hidden] { display: none; }
    .fit { height: calc(100dvh - 190px); min-height: 480px; }
    .device { position: static; transform: none !important; width: 100% !important; height: 100% !important; border-width: 6px !important; border-radius: 18px !important; box-sizing: border-box; }
    .device iframe { border-radius: 12px !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div>
    <h1>喫茶ことり 注文システム</h1>
    <p class="lead">デモ版です。オーナーのiPadとお客様のスマホ、両方の画面を実際に操作できます。</p>
  </div>
  <ol class="steps">
    <li><b>1</b>スマホでメニューを選んで注文</li>
    <li><b>2</b>iPadのホール・注文に届く</li>
    <li><b>3</b>iPadの「会計」で番号札の番号を入力</li>
  </ol>
  <span class="confirm" id="reset-area"><button class="btn" id="reset" type="button">最初の状態に戻す</button></span>
</header>

<div class="tabs" role="tablist" aria-label="表示する画面">
  <button class="tab" role="tab" id="tab-phone" aria-selected="true" type="button">📱 お客様のスマホ</button>
  <button class="tab" role="tab" id="tab-ipad" aria-selected="false" type="button">オーナーのiPad</button>
</div>

<main class="stage">
  <section class="col ipad" id="col-ipad">
    <div class="label">オーナーのiPad <small>PIN入力は省略しています（本番の初期PINは1234）</small></div>
    <div class="fit" id="fit-ipad"><div class="device ipad" data-w="1180" data-h="820"><iframe id="ipad" title="オーナーのiPad画面"></iframe></div></div>
  </section>
  <section class="col phone" id="col-phone">
    <div class="label"><label for="tag">お客様のスマホ</label><small>読み取る番号札</small>
      <select id="tag"></select></div>
    <div class="fit" id="fit-phone"><div class="device phone" data-w="390" data-h="800"><iframe id="phone" title="お客様のスマホ画面"></iframe></div></div>
  </section>
</main>

<script src="demo-shim.js"></script>
<script>
  (function () {
    var demo = window.__cafeDemo;
    var tagSel = document.getElementById('tag');
    var phone = document.getElementById('phone');

    function openTag(no) {
      var t = demo.tags().find(function (x) { return x.no === no; });
      if (t) phone.src = 'order.html?tag=' + t.no + '&k=' + encodeURIComponent(t.key);
    }

    demo.ready.then(function () {
      var tags = demo.tags();
      var start = 3;
      try { start = Number(sessionStorage.getItem('demo-tag')) || 3; } catch (e) {}
      tagSel.innerHTML = tags.map(function (t) { return '<option value="' + t.no + '"' + (t.no === start ? ' selected' : '') + '>' + t.no + '番</option>'; }).join('');
      openTag(start);
      document.getElementById('ipad').src = 'admin.html';
      layout();
    });

    tagSel.addEventListener('change', function () {
      var no = Number(tagSel.value);
      try { sessionStorage.setItem('demo-tag', String(no)); } catch (e) {}
      openTag(no);
    });

    // 最初の状態に戻す（確認つき）
    var area = document.getElementById('reset-area');
    area.addEventListener('click', function (ev) {
      var b = ev.target.closest('button');
      if (!b) return;
      if (b.id === 'reset') {
        area.innerHTML = '<span>注文・売上をすべて消して最初の状態に戻しますか？</span><button class="btn" type="button" data-v="yes">戻す</button><button class="btn" type="button" data-v="no">やめる</button>';
      } else if (b.dataset.v === 'yes') {
        demo.reset();
        location.reload();
      } else {
        area.innerHTML = '<button class="btn" id="reset" type="button">最初の状態に戻す</button>';
      }
    });

    // 狭い画面のタブ切り替え
    var tabs = { phone: document.getElementById('tab-phone'), ipad: document.getElementById('tab-ipad') };
    var cols = { phone: document.getElementById('col-phone'), ipad: document.getElementById('col-ipad') };
    function show(which) {
      ['phone', 'ipad'].forEach(function (k) {
        tabs[k].setAttribute('aria-selected', String(k === which));
        cols[k].hidden = narrow() && k !== which;
      });
    }
    tabs.phone.addEventListener('click', function () { show('phone'); });
    tabs.ipad.addEventListener('click', function () { show('ipad'); });
    function narrow() { return window.matchMedia('(max-width: 860px)').matches; }

    // 広い画面：iPadとスマホを画面に収まるよう縮小して並べる
    function layout() {
      if (narrow()) {
        ['fit-phone', 'fit-ipad'].forEach(function (id) { var b = document.getElementById(id); b.style.width = ''; b.style.height = ''; });
        show(tabs.ipad.getAttribute('aria-selected') === 'true' ? 'ipad' : 'phone');
        return;
      }
      cols.phone.hidden = false; cols.ipad.hidden = false;
      var availH = window.innerHeight - document.querySelector('.stage').getBoundingClientRect().top - 50;
      var phoneDev = document.querySelector('.device.phone');
      var pw = 390 + 24, ph = 800 + 24;
      var ps = Math.min(1, Math.max(0.5, availH / ph));
      fit(phoneDev, document.getElementById('fit-phone'), ps, pw, ph);
      var ipadDev = document.querySelector('.device.ipad');
      var iw = 1180 + 28, ih = 820 + 28;
      var colW = cols.ipad.getBoundingClientRect().width;
      var is = Math.min(1, colW / iw, Math.max(0.4, availH / ih));
      fit(ipadDev, document.getElementById('fit-ipad'), is, iw, ih);
    }
    function fit(dev, box, s, w, h) {
      dev.style.width = (w - (dev.classList.contains('ipad') ? 28 : 24)) + 'px';
      dev.style.height = (h - (dev.classList.contains('ipad') ? 28 : 24)) + 'px';
      dev.style.transform = 'scale(' + s + ')';
      box.style.width = Math.floor(w * s) + 'px';
      box.style.height = Math.floor(h * s) + 'px';
    }
    window.addEventListener('resize', layout);
    layout();
  })();
</script>
