<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>テーブル注文システム</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/common.css">
  <style>
    main { max-width: 560px; margin: 0 auto; padding: 48px 16px; text-align: center; }
    .logo { font-size: 56px; }
    h1 { font-family: var(--serif); margin: 8px 0 12px; }
    .steps { text-align: left; margin: 24px 0; padding: 16px 20px; }
    .steps li { margin: 6px 0; }
  </style>
</head>
<body>
  <main>
    <div class="logo">☕</div>
    <h1>テーブル注文システム</h1>
    <p class="muted">お客様は、お渡しした番号札のQRコードをスマホで読み取ってご注文ください。</p>
    <ol class="card steps">
      <li>受付で番号札を受け取る</li>
      <li>札のQRをスマホで読み取り、席から注文</li>
      <li>お会計は札をレジへ（チケット・割り勘OK）</li>
    </ol>
    <a class="btn btn-primary btn-lg" href="/admin">オーナー画面を開く</a>
  </main>
</body>
</html>
