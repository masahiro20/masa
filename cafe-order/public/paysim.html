<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>テスト支払い｜まめレジ</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/common.css">
  <style>
    main { max-width: 420px; margin: 0 auto; padding: 32px 16px; text-align: center; display: flex; flex-direction: column; gap: 16px; }
    .badge-test { align-self: center; }
    .amount { font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .done { font-size: 22px; font-weight: 800; color: var(--ok); }
  </style>
</head>
<body>
  <main id="app"><p class="muted">読み込み中…</p></main>
  <script type="module">
    const mpid = location.pathname.split('/').pop();
    const app = document.getElementById('app');
    const yen = (n) => '¥' + Number(n).toLocaleString('ja-JP');
    async function load() {
      const r = await fetch(`/api/pay/sim/${encodeURIComponent(mpid)}`).then((x) => x.json()).catch(() => ({}));
      if (r.status !== 'pending') {
        app.innerHTML = '<span class="chip chip-warn badge-test">テストモード</span><p>このQRコードは使えません。<br>期限切れか、すでに支払い済みです。</p>';
        return;
      }
      app.innerHTML = `<span class="chip chip-warn badge-test">テストモード（実際のお金は動きません）</span>
        <div class="muted">${r.shop.replace(/[<>&]/g, '')} へのお支払い</div><div class="amount">${yen(r.amount)}</div>
        <button class="btn btn-primary btn-lg btn-block" id="pay">テストとして支払う</button>
        <p class="small muted">まめレジの動作確認用の画面です。本番ではお客様のPayPayアプリで支払いが行われます。</p>`;
      document.getElementById('pay').onclick = async () => {
        const res = await fetch(`/api/pay/sim/${encodeURIComponent(mpid)}`, { method: 'POST' });
        app.innerHTML = res.ok ? '<div class="done">✓ 支払いました</div><p class="muted">お店の画面に「お支払いが完了しました」と表示されます。</p>' : '<p>支払いできませんでした。お店の画面でQRを出し直してください。</p>';
      };
    }
    load();
  </script>
</body>
</html>
