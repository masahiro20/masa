<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMPASS Meet</title>
<link rel="icon" href="/static/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 読み込み中・エラー -->
<div class="center-msg" id="loading"><div><div class="spinner"></div><span class="muted">準備しています</span></div></div>
<div class="center-msg hidden" id="fatal"><div><h2 id="fatalTitle">この通話は見つかりません</h2><p class="muted" id="fatalText"></p><div class="row" id="fatalActions"><a class="btn" href="/">トップへ戻る</a></div></div></div>

<!-- 入室前 -->
<div class="lobby hidden" id="lobby">
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M16 5.5 19.2 16H12.8Z" fill="#c63d2f"/><path d="M16 26.5 12.8 16h6.4Z" fill="currentColor"/></svg>
      <span class="word">COMPASS<i>.</i></span>
      <span class="sub">Meet</span>
    </a>
  </header>
  <div class="inner">
    <div class="preview">
      <video id="preview" autoplay playsinline muted></video>
      <div class="off hidden" id="previewOff">カメラはオフです</div>
      <div class="ctrls">
        <button class="round" id="pMic" title="マイク"></button>
        <button class="round" id="pCam" title="カメラ"></button>
      </div>
    </div>
    <div>
      <div class="eyebrow">Online Meeting</div>
      <h1 id="lTitle">オンライン打ち合わせ</h1>
      <div class="when" id="lWhen"></div>
      <div class="notice hidden" id="mediaNotice"></div>
      <div class="field"><label for="name">お名前</label><input id="name" maxlength="40" placeholder="山田 太郎" autocomplete="name"></div>
      <div class="row">
        <button class="btn primary" id="joinBtn">参加する</button>
        <a class="btn ghost" href="/">戻る</a>
      </div>
      <div class="wait muted hidden" id="waitBox"><div class="spinner"></div><span>担当者が入室を許可するまで、このままお待ちください。</span></div>
    </div>
  </div>
</div>

<!-- 通話中 -->
<div class="call hidden" id="call">
  <div class="main">
    <div class="stage n1" id="stage"></div>
    <aside class="side hidden" id="side">
      <header><h3 id="sideTitle">チャット</h3><button class="x" id="sideClose" aria-label="閉じる">×</button></header>
      <div class="body" id="peoplePane"></div>
      <div class="body hidden" id="chatPane"><div class="muted" id="chatEmpty">メッセージは参加中の方にだけ表示され、通話が終わると残りません。</div></div>
      <div class="foot hidden" id="chatFoot"><input id="chatInput" maxlength="1000" placeholder="メッセージを送信"><button class="btn primary" id="chatSend">送信</button></div>
    </aside>
  </div>
  <div class="bar">
    <div class="left"><span id="clock"></span><span class="sep"></span><span id="cTitle"></span></div>
    <div class="center">
      <button class="round" id="mic" title="マイク（Ctrl+D）"></button>
      <button class="round" id="cam" title="カメラ（Ctrl+E）"></button>
      <button class="round" id="screen" title="画面を共有"></button>
      <button class="round leave" id="leave" title="退出"></button>
    </div>
    <div class="right">
      <button class="round" id="peopleBtn" title="参加者"></button>
      <button class="round" id="chatBtn" title="チャット"></button>
      <button class="round" id="linkBtn" title="招待リンクをコピー"></button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>
<script src="/static/room.js"></script>
</body>
</html>
